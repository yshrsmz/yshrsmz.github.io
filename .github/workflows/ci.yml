name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Check Node.js version
        run: |
          mise exec node -- node --version

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm -r --if-present test

      - name: build
        run: pnpm blog:build

  action-create-scrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm --filter @codingfeline/action-create-scrap typecheck

      - name: package
        run: pnpm --filter @codingfeline/action-create-scrap package

      - name: Check dist is up to date
        run: |
          # --porcelain also reports untracked files, e.g. a new chunk emitted by the bundler
          if [[ -n "$(git status --porcelain -- packages/action-create-scrap/dist)" ]]; then
            echo "::error::packages/action-create-scrap/dist is out of date. Add the build-and-commit label, or run 'pnpm --filter @codingfeline/action-create-scrap package' and commit the result."
            git status --short -- packages/action-create-scrap/dist
            exit 1
          fi

  biome:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mongolyy/reviewdog-action-biome@fbaff9a1982d038b6c068d55c609c1d20b4abeef # v2.12.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
